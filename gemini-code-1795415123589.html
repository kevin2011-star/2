<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 猜拳大對決</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-light: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(251, 191, 36, 0.1), transparent 25%);
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border: 2px solid #334155;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* 畫面切換控制 */
        .screen {
            display: none;
            padding: 40px;
            flex-grow: 1;
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: flex; flex-direction: column; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 標題與共用元件 */
        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        h1 { color: var(--accent-gold); font-size: 2.5rem; font-weight: 900; }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        /* 畫面 1: 登入 */
        #screen-login { justify-content: center; align-items: center; }
        .input-group { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; }
        input[type="text"] {
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 12px;
            border: 2px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        /* 畫面 2: 裝備室 */
        .eq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .eq-card {
            background: #334155;
            border: 2px solid #475569;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }
        .eq-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); }
        .eq-icon { font-size: 3rem; }
        .eq-title { font-weight: 700; font-size: 1.2rem; color: var(--accent-gold); }
        .eq-desc { font-size: 0.9rem; color: #cbd5e1; }

        /* 畫面 3: 戰鬥區 */
        .battle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .score-board { text-align: center; }
        .score-board .name { font-size: 1rem; color: #94a3b8; }
        .score-board .score { font-size: 2.5rem; font-weight: 900; }
        .score-player { color: var(--accent-green); }
        .score-bot { color: var(--accent-red); }

        .vs-badge {
            background: var(--accent-gold);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 900;
            font-style: italic;
        }

        .console {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 12px;
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .log-sys { color: #94a3b8; }
        .log-win { color: var(--accent-green); font-weight: bold; }
        .log-lose { color: var(--accent-red); font-weight: bold; }
        .log-tie { color: var(--accent-gold); }
        .log-skill { color: var(--accent-purple); font-weight: bold; text-shadow: 0 0 5px rgba(139,92,246,0.5); }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .rps-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn-rps {
            flex: 1;
            background: #334155;
            font-size: 2rem;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-rps:hover { background: #475569; border-color: var(--accent-gold); transform: scale(1.05); }
        .btn-rps:active { transform: scale(0.95); }
        
        .btn-skill {
            background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
            width: 100%;
            display: none; /* 預設隱藏，裝備預知眼鏡才顯示 */
        }
        .btn-skill:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.7; }
        
        #btn-restart { display: none; background: var(--accent-green); }

    </style>
</head>
<body>

<div id="app">
    <!-- Screen 1: 登入 -->
    <div id="screen-login" class="screen active">
        <h1>⚔️ 異世界猜拳大對決</h1>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="輸入冒險者名字..." autocomplete="off">
            <button class="btn" onclick="startGame()">進入裝備室</button>
        </div>
    </div>

    <!-- Screen 2: 裝備選擇 -->
    <div id="screen-equip" class="screen">
        <h2>🛠️ 選擇你的特殊裝備</h2>
        <p style="text-align: center; color: #94a3b8;">每局限選一個，被動技能自動發動，主動技能請抓準時機！</p>
        <div class="eq-grid">
            <div class="eq-card" onclick="selectEquip(1, '🛡️ 神聖防護盾')">
                <div class="eq-icon">🛡️</div>
                <div class="eq-title">神聖防護盾</div>
                <div class="eq-desc">【被動】即將輸掉時發動，抵消電腦 1 次得分。</div>
            </div>
            <div class="eq-card" onclick="selectEquip(2, '💥 爆擊護腕')">
                <div class="eq-icon">💥</div>
                <div class="eq-title">爆擊護腕</div>
                <div class="eq-desc">【被動】獲勝時發動，該回合直接獲得 2 分。</div>
            </div>
            <div class="eq-card" onclick="selectEquip(3, '🔮 預知未來眼鏡')">
                <div class="eq-icon">🔮</div>
                <div class="eq-title">預知未來眼鏡</div>
                <div class="eq-desc">【主動】對決前使用，可提前看見電腦出拳。</div>
            </div>
            <div class="eq-card" onclick="selectEquip(0, '無裝備 (裸裝挑戰)')">
                <div class="eq-icon">💪</div>
                <div class="eq-title">裸裝挑戰</div>
                <div class="eq-desc">不帶任何裝備，純粹實力的對決！</div>
            </div>
        </div>
    </div>

    <!-- Screen 3: 戰鬥區 -->
    <div id="screen-battle" class="screen">
        <div class="battle-header">
            <div class="score-board">
                <div class="name" id="display-name">冒險者</div>
                <div class="score score-player" id="score-player">0</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-board">
                <div class="name">機械魔像</div>
                <div class="score score-bot" id="score-bot">0</div>
            </div>
        </div>

        <div class="console" id="game-console">
            <!-- 遊戲日誌會注入在這裡 -->
        </div>

        <div class="controls" id="battle-controls">
            <button id="btn-skill" class="btn btn-skill" onclick="useSkill()">🔮 發動「預知未來」</button>
            <div class="rps-btns">
                <button class="btn-rps" onclick="playRound('剪刀')">✌️</button>
                <button class="btn-rps" onclick="playRound('石頭')">✊</button>
                <button class="btn-rps" onclick="playRound('布')">✋</button>
            </div>
        </div>
        
        <button id="btn-restart" class="btn" onclick="resetGame()">🔄 再玩一次，重新挑選裝備！</button>
    </div>
</div>

<script>
    // --- 遊戲狀態 ---
    const GAME_WIN_SCORE = 5;
    let playerName = "";
    let eqChoice = 0; 
    let eqName = "";
    let playerWins = 0;
    let computerWins = 0;
    let roundNum = 1;
    let skillUsed = false;
    
    // 電腦這回合預定要出的拳 (為了支援預知眼鏡)
    let botNextChoice = ""; 
    const options = ["剪刀", "石頭", "布"];

    // --- UI 元素 ---
    const screens = {
        login: document.getElementById('screen-login'),
        equip: document.getElementById('screen-equip'),
        battle: document.getElementById('screen-battle')
    };
    const uiConsole = document.getElementById('game-console');
    const uiScorePlayer = document.getElementById('score-player');
    const uiScoreBot = document.getElementById('score-bot');
    const uiBtnSkill = document.getElementById('btn-skill');
    const uiBattleControls = document.getElementById('battle-controls');
    const uiBtnRestart = document.getElementById('btn-restart');

    // --- 核心邏輯 ---

    function switchScreen(targetScreen) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[targetScreen].classList.add('active');
    }

    function logMsg(msg, type = "log-sys") {
        const div = document.createElement('div');
        div.className = type;
        div.innerText = msg;
        uiConsole.appendChild(div);
        uiConsole.scrollTop = uiConsole.scrollHeight; // 自動滾動到底部
    }

    function startGame() {
        const inputName = document.getElementById('player-name').value.trim();
        playerName = inputName === "" ? "無名勇者" : inputName;
        document.getElementById('display-name').innerText = playerName;
        switchScreen('equip');
    }

    function selectEquip(id, name) {
        eqChoice = id;
        eqName = name;
        initBattle();
        switchScreen('battle');
    }

    function generateBotChoice() {
        return options[Math.floor(Math.random() * options.length)];
    }

    function initBattle() {
        playerWins = 0;
        computerWins = 0;
        roundNum = 1;
        skillUsed = false;
        
        uiScorePlayer.innerText = "0";
        uiScoreBot.innerText = "0";
        uiConsole.innerHTML = ""; // 清空日誌
        uiBattleControls.style.display = "flex";
        uiBtnRestart.style.display = "none";

        // 主動技能按鈕顯示邏輯
        if(eqChoice === 3) {
            uiBtnSkill.style.display = "block";
            uiBtnSkill.disabled = false;
            uiBtnSkill.innerText = "🔮 發動「預知未來」";
        } else {
            uiBtnSkill.style.display = "none";
        }

        logMsg(`【系統廣播】歡迎勇敢的冒險者【${playerName}】！`);
        logMsg(`【裝備確認】你攜帶了：${eqName}`);
        logMsg(`=== ✊✋✌️ 終極大對決開始 (先達 5 勝者贏) ===`);
        
        startRound();
    }

    function startRound() {
        logMsg(`\n--- 第 ${roundNum} 回合 ---`);
        botNextChoice = generateBotChoice(); // 提早決定電腦出拳
    }

    function useSkill() {
        if (eqChoice === 3 && !skillUsed) {
            logMsg(`✨ 【預知未來眼鏡】發動！你看到電腦準備出：【${botNextChoice}】`, 'log-skill');
            skillUsed = true;
            uiBtnSkill.disabled = true;
            uiBtnSkill.innerText = "🔮 技能已使用";
        }
    }

    function playRound(playerChoice) {
        let currentBotChoice = botNextChoice;
        logMsg(`你出了：${playerChoice} | 🤖 電腦出了：${currentBotChoice}`);

        if (playerChoice === currentBotChoice) {
            logMsg("平手！沒有人得分。", "log-tie");
        } 
        else if (
            (playerChoice === "剪刀" && currentBotChoice === "布") ||
            (playerChoice === "石頭" && currentBotChoice === "剪刀") ||
            (playerChoice === "布" && currentBotChoice === "石頭")
        ) {
            logMsg("🎉 這回合你贏了！", "log-win");
            
            // 處理【爆擊護腕】發動邏輯
            if (eqChoice === 2 && !skillUsed) {
                logMsg("✨ 【爆擊護腕】發動！造成雙倍傷害，獲得 2 分！", "log-skill");
                playerWins += 2;
                skillUsed = true;
            } else {
                playerWins += 1;
            }
        } 
        else {
            logMsg("💥 這回合電腦贏了！", "log-lose");
            
            // 處理【神聖防護盾】發動邏輯
            if (eqChoice === 1 && !skillUsed) {
                logMsg("✨ 【神聖防護盾】發動！成功擋下電腦的攻擊，電腦本回合不加分！", "log-skill");
                skillUsed = true;
            } else {
                computerWins += 1;
            }
        }

        // 更新分數
        uiScorePlayer.innerText = playerWins;
        uiScoreBot.innerText = computerWins;
        roundNum++;

        // 檢查勝負
        if (playerWins >= GAME_WIN_SCORE || computerWins >= GAME_WIN_SCORE) {
            endGame();
        } else {
            startRound(); // 準備下一回合
        }
    }

    function endGame() {
        logMsg(`\n=== 🌟 最終結果 🌟 ===`);
        if (playerWins >= GAME_WIN_SCORE) {
            logMsg(`🏆 恭喜！你以 ${playerWins} : ${computerWins} 擊敗了電腦！`, "log-win");
        } else {
            logMsg(`💻 很可惜，電腦以 ${computerWins} : ${playerWins} 獲得了勝利！`, "log-lose");
        }
        
        uiBattleControls.style.display = "none";
        uiBtnRestart.style.display = "block";
    }

    function resetGame() {
        switchScreen('equip');
    }

    // 支援 Enter 鍵快速開始
    document.getElementById('player-name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startGame();
    });
</script>

</body>
</html>
